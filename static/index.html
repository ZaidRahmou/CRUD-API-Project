<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CRUD Operations</title>
    </head>
    <script>
        //learn
        function createStudent() {
            let fname = document.getElementById("create_student_fname").value;
            let lname = document.getElementById("create_student_lname").value;
            let phone = document.getElementById("create_student_phone_number").value;
            let parentPhone = document.getElementById("create_student_parent_phone_number").value;
            let address = document.getElementById("create_student_address").value;
            let email = document.getElementById("create_student_email").value;
            //learn
            fetch("http://127.0.0.1:8000/student", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    student_fname: fname,
                    student_lname: lname,
                    student_phone_number: phone,
                    student_parent_phone_number: parentPhone,
                    student_address: address,
                    student_email: email
        })
    })
    //learn
    .then(response => response.json())
    .then(data => alert(data))
        }
    </script>
    <body>
        <h1>CRUD Operations</h1>
        <h3>Create Student</h3>
        <input type="text" placeholder="First Name" id="create_student_fname">
        <input type="text" placeholder="Last Name" id="create_student_lname">
        <input type="text" placeholder="Phone Number" id="create_student_phone_number">
        <input type="text" placeholder="Parent Phone Number" id="create_student_parent_phone_number">
        <input type="text" placeholder="Address" id="create_student_address">
        <input type="email" placeholder="Email" id="create_student_email">
        <button id="create_student">Create</button>
        <h3>Read Student</h3>
        <input type="text" placeholder="Student ID" id="read_student_id">
        <button id="read_student">Read</button>
        <h3>Update Student</h3>
        <input type="text" placeholder="Student ID" id="update_student_id">
        <input type="text" placeholder="First Name" id="update_student_fname">
        <input type="text" placeholder="Last Name" id="update_student_lname">
        <input type="text" placeholder="Phone Number" id="update_student_phone_number">
        <input type="text" placeholder="Parent Phone Number" id="update_student_parent_phone_number">
        <input type="text" placeholder="Address" id="update_student_address">
        <input type="email" placeholder="Email" id="update_student_email">
        <button id="update_student">Update</button>
        <h3>Delete Student</h3>
        <input type="text" placeholder="Student ID" id="delete_student_id">
        <button id="delete_student">Delete</button>
    </body>
</html>
